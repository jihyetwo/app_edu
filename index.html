지원 조건\n\n적용 대상 자녀의 연령, 학년 기준, 그리고 가정별(맞벌이, 외벌이, 다자녀) 충족 조건을 명확히 확인해야 합니다. 서류 준비 전 자격 조건을 미리 체크해 보세요.\n\n학부모님들이 실전에서 꼭 기억하셔야 할 핵심 포인트는 다음과 같습니다:\n\n- **첫째, 정확한 일정과 예약 기준 확인**: 현장 발권이 불가능하고 사전 온라인 예약만 받는 경우가 많으므로 오픈 D-Day를 미리 달력에 표시해 두세요.\n- **둘째, 연령 및 증빙 서류 지참**: 자녀의 생년월일을 증명할 수 있는 주민등록등본 또는 모바일 가족관계증명서를 스마트폰에 미리 저장해 두시면 편리합니다.\n- **셋째, 주차 및 이동 동선 파악**: 주말 혼잡 시간대에는 대중교통 이용이 훨씬 유리할 수 있으며, 인근 공영주차장 위치를 사전에 체크하시는 것을 권장합니다.\n\n[이미지: 휴대폰 수거-놓치기-쉬운-필수-주의.png]\n\n## 3. 놓치기 쉬운 필수 주의사항과 신청 꿀팁\n\n신청 기한 및 선착순 마감 여부, 그리고 온라인 접수(공공서비스예약/정부24) 시 유의할 점을 안내해 드립니다. 사전 확인 없이 방문하거나 접수일을 넘기지 않도록 일정을 달력에 기록해 두세요.\n\n학부모님들이 실전에서 꼭 기억하셔야 할 핵심 포인트는 다음과 같습니다:\n\n- **첫째, 정확한 일정과 예약 기준 확인**: 현장 발권이 불가능하고 사전 온라인 예약만 받는 경우가 많으므로 오픈 D-Day를 미리 달력에 표시해 두세요.\n- **둘째, 연령 및 증빙 서류 지참**: 자녀의 생년월일을 증명할 수 있는 주민등록등본 또는 모바일 가족관계증명서를 스마트폰에 미리 저장해 두시면 편리합니다.\n- **셋째, 주차 및 이동 동선 파악**: 주말 혼잡 시간대에는 대중교통 이용이 훨씬 유리할 수 있으며, 인근 공영주차장 위치를 사전에 체크하시는 것을 권장합니다.\n\n## 📌 출발 전 / 신청 전 최종 체크리스트\n\n진행하시기 전에 아래 체크박스를 하나씩 점검해 보세요.\n\n□ 우리 아이의 연령·학년 기준이 대상에 정확히 부합하는지 확인\n□ 사전 예약이 필수인지, 현장 선착순 입장인지 재확인\n□ 정기 휴관일(특히 매주 월요일 부분 휴관 여부) 확인\n□ 증빙 서류(가족관계증명서, 주민등록등본 등) 지참 준비\n□ 함께 갈 가족의 일정 조율 및 대체 코스 마련\n\n## ✅ 핵심 요약 박스\n\n✅ **휴대폰 수거**는 사전 준비와 예약 일정 확인이 성패를 가릅니다.\n✅ 공식 안내와 지자체 규정을 꼼꼼히 확인하고 신청 기한을 놓치지 마세요.\n✅ 가족과 함께하는 소중한 시간이 헛걸음으로 끝나지 않도록 사전 체크리스트를 꼭 활용하세요.\n\n아이들과 함께하는 알차고 행복한 교육 활동, 아자스쿨이 늘 함께 응원합니다 💛\n\n👉🏻 **지금 아자스쿨에서 우리 아이에게 꼭 맞는 다양한 체험 프로그램을 만나보세요!**\nwww.ajaschool.com?utm_source=instagram&utm_medium=manychat&utm_campaign=휴대폰 수거\n\n📸 **아자스쿨 공식 채널:**\n· 인스타그램: @ajaschool_kr\n· 유튜브: 아자스쿨 공식 채널\n· 스마트폰 앱: 앱스토어 / 구글 플레이스토어에서 '아자스쿨' 검색\n\n출처 및 참고: (팩트체크 URL), - 국가인권위원회 보도자료 7609749 (수거·소지·사용 전면제한 권고, 학교 불수용), https://www.humanrights.go.kr/base/board/read?boardManagementNo=24&boardNo=7609749&menuLevel=3&menuNo=91, - 국가인권위원회 보도자료 7610472 (일과 내 소지 전면제한 권고, 학교 불수용), https://www.humanrights.go.kr/base/board/read?boardManagementNo=24&boardNo=7610472&menuLevel=3&menuNo=91, - 아시아경제 (2026.06.10) https://www.asiae.co.kr/article/202606100807209276     let currentCampaign = null;
    let currentTab = 'blog';

    function init() {
      renderList(CAMPAIGNS);
      if (CAMPAIGNS.length > 0) {
        selectCampaign(CAMPAIGNS[0].folder_name);
      }
    }

    function renderList(list) {
      const ul = document.getElementById('campaign-list');
      ul.innerHTML = list.map(c => `
        <li class="campaign-item ${currentCampaign && currentCampaign.folder_name === c.folder_name ? 'active' : ''}" onclick="selectCampaign('${c.folder_name}')">
          <div class="campaign-cat">${c.category}</div>
          <div class="campaign-name">${c.folder_name}</div>
          <div class="campaign-badges">
            <span class="badge badge-blog">블로그 2,500자</span>
            <span class="badge badge-app">앱게시판</span>
          </div>
        </li>
      `).join('');
    }

    function filterList() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = CAMPAIGNS.filter(c => c.folder_name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
      renderList(filtered);
    }

    function selectCampaign(folderName) {
      currentCampaign = CAMPAIGNS.find(c => c.folder_name === folderName);
      if (!currentCampaign) return;
      document.getElementById('current-title').innerText = currentCampaign.folder_name;
      renderList(CAMPAIGNS);
      renderContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      renderContent();
    }

    function renderContent() {
      if (!currentCampaign || !currentCampaign.data) return;
      const view = document.getElementById('content-view');
      const data = currentCampaign.data;

      if (currentTab === 'blog') {
        view.innerHTML = data.blog_html || '<pre>' + escapeHtml(data.blog_md) + '</pre>';
      } else if (currentTab === 'app') {
        view.innerHTML = '<pre style="white-space: pre-wrap; line-height: 1.7;">' + escapeHtml(data.app_md) + '</pre>';
      } else {
        view.innerHTML = '<pre style="white-space: pre-wrap; line-height: 1.6; font-size:13px;">' + escapeHtml(data.blog_md) + '</pre>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    async function copyBlogHTML() {
      if (!currentCampaign || !currentCampaign.data) return;
      await navigator.clipboard.writeText(currentCampaign.data.blog_md);
      showToast('📋 네이버 블로그용 본문이 복사되었습니다! (스마트에디터 ONE 붙여넣기)');
    }

    async function copyMarkdown() {
      if (!currentCampaign || !currentCampaign.data) return;
      await navigator.clipboard.writeText(currentCampaign.data.blog_md);
      showToast('📄 마크다운 전문이 복사되었습니다!');
    }

    async function copyTags() {
      if (!currentCampaign || !currentCampaign.data) return;
      const text = currentCampaign.data.blog_md;
      const m = text.match(/## 🏷️ 네이버 블로그 태그.*?\n```(.*?)```/s);
      if (m) {
        await navigator.clipboard.writeText(m[1].trim());
        showToast('🏷️ 태그 30개가 복사되었습니다!');
      } else {
        showToast('태그를 찾을 수 없습니다.');
      }
    }

    init();
